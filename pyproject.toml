[project]
name = "observable-python-ai-service"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0", "pydantic==2.14.2", "sqlalchemy==2.1.6",
  "alembic==1.20.1", "psycopg[binary]==3.3.6", "celery[redis]==5.6.3",
  "redis==6.4.0", "uvicorn==0.54.0", "httpx==0.28.1",
  "opentelemetry-api==1.45.2", "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-instrumentation-fastapi==0.66b2",
  "opentelemetry-instrumentation-celery==0.66b2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3", "docker==7.2.0"]

[project.scripts]
p19 = "p19.cli:main"
p19-dispatcher = "p19.dispatcher:main"
p19-report = "p19.reporting:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p19"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
