name: Offline verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate local-only configuration
        run: python3 scripts/setup.py

      - name: Run canonical offline verification
        run: docker compose -p p19-check run --rm --build -T checks python scripts/verify.py

      - name: Retain verification receipts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-verification-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .local/runs/verify-*/manifest.json
            .local/runs/verify-*/receipt.json
            .local/runs/verify-*/junit.xml
            .local/runs/verify-*/uv.log
            .local/runs/verify-*/ruff.log
            .local/runs/verify-*/ruff-format.log
            .local/runs/verify-*/pytest.log

      - name: Remove owned test containers
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -p p19-check down --remove-orphans
          fi
