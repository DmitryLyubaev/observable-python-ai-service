name: Offline verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate local-only configuration
        run: python3 scripts/setup.py

      - name: Run canonical offline verification
        run: docker compose -p p19-check run --rm --build -T checks python scripts/verify.py

      - name: Record verification receipts and test totals
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          receipts = sorted(Path('.local/runs').glob('verify-*/receipt.json'))
          if not receipts:
              raise SystemExit('No verification receipt was produced; inspect the check-step log.')
          for path in receipts:
              receipt = json.loads(path.read_text())
              manifest = json.loads((path.parent / 'manifest.json').read_text())
              totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
              junit = path.parent / 'junit.xml'
              if junit.exists():
                  for suite in ET.parse(junit).getroot().iter('testsuite'):
                      for field in totals:
                          totals[field] += int(suite.get(field, 0))
              record = {'receipt': receipt, 'manifest': manifest, 'junit': totals}
              print(json.dumps(record, sort_keys=True))
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                  summary.write('## Offline verification\n\n')
                  summary.write(f"Verifier success: `{receipt['success']}`\n\n")
                  summary.write(f"Source: `{receipt['source']}`\n\n")
                  summary.write(f'Test totals: `{json.dumps(totals, sort_keys=True)}`\n')
          PY

      - name: Remove owned test containers
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -p p19-check down --remove-orphans
          fi
